<!DOCTYPE html>
<html>
<head>

    <title>IT Support Login</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #ccc;
        }

        h1 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>🔐 IT Support</h1>

    <label>User Type</label>

    <select id="role">
        <option value="employee">Employee</option>
        <option value="admin">Admin</option>
    </select>

    <label>Username</label>

    <input
        type="text"
        id="username"
        placeholder="Enter username"
    >

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="login()">
        Login
    </button>

    <p id="message"></p>

</div>


<script>

function login() {

    const role = document.getElementById("role").value;

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (!username || !password) {

        document.getElementById("message").innerText =
            "Please enter username and password.";

        return;
    }

    if (role === "admin" &&
        username === "admin" &&
        password === "admin123") {

        window.location.href = "/";

    }

    else if (role === "employee" &&
             username === "employee" &&
             password === "employee123") {

        window.location.href = "/";

    }

    else {

        document.getElementById("message").innerText =
            "Invalid username or password.";

    }

}

</script>

</body>
</html>
